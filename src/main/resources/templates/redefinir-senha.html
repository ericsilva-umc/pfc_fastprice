<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fast Price - Redefinição de Senha</title>
        <link rel="icon" type="image/png" href="/imgs/cart.png">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <link rel="stylesheet" href="/css/style_forgetpassword_form.css">
    </head>
    <body>
        <div class="container">
            <div class="logo-container">
                <a th:href="@{/}">
                    <img src="/imgs/logo.png" alt="Fast Price Logo" class="logo">
                </a>
            </div>
            <div class="forget-card">
                <div th:if="${erro}">
                    <a th:href="@{/login}" class="back-button">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    
                    <h1 class="mb-2">Redefinição de senha</h1>
                    
                    <p class="error" th:text="${erro}"></p>
                </div>

                <div th:if="${erro == null}">
                    <form th:action="@{/redefinir-senha}" method="POST" oninput="repetir.setCustomValidity(repetir.value != senha.value ? 'As senhas não conferem.' : '')">
                        <h1 class="mb-2">Redefinição de senha</h1>
                        
                        <input type="hidden" name="token" th:value="${token}"/>
                        <input type="password" name="senha" id="campoSenha" class="input-field" placeholder="Digite uma senha" required>
                        <input type="password" name="repetir" id="campoSenhaRepetir" class="input-field" placeholder="Repita a senha">
                        
                        <input type="submit" value="Redefinir Senha" class="btn btn-primary">
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
